let index=0,score={agent:0,hoarder:0,joy:0,detail:0,survivor:0,cart:0};
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function startQuiz(){index=0;score={agent:0,hoarder:0,joy:0,detail:0,survivor:0,cart:0};show('quiz');renderQ()}
function renderQ(){const q=qs[index];document.getElementById('counter').textContent=`第${index+1}题 / 共${qs.length}题`;document.getElementById('progress').style.width=`${(index/qs.length)*100}%`;document.getElementById('qtag').textContent=q[1];document.getElementById('question').textContent=q[0];const box=document.getElementById('options');box.innerHTML='';q[2].forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML=`<b>${String.fromCharCode(65+i)}</b>${o[0]}`;b.onclick=()=>answer(o[1]);box.appendChild(b)})}
function answer(type){score[type]++;if(index<qs.length-1){index++;renderQ()}else showResult()}
function showResult(){const key=Object.keys(score).sort((a,b)=>score[b]-score[a])[0],r=types[key];document.getElementById('progress').style.width='100%';['resultEmoji','resultTitle','resultBadge','roast','catchphrase','wallet','scene','hidden','quote','advice'].forEach(id=>{const map={resultEmoji:r.emoji,resultTitle:r.title,resultBadge:r.badge,roast:r.roast,catchphrase:r.catchphrase,wallet:r.wallet,scene:r.scene,hidden:r.hidden,quote:r.quote,advice:r.advice};document.getElementById(id).textContent=map[id]});show('result')}
function restart(){startQuiz()}
function copyResult(){const title=document.getElementById('resultTitle').textContent;const badge=document.getElementById('resultBadge').textContent;const text=`我的消费人格是：${title}\n隐藏称号：${badge}\n快来测测你是哪一种！`;navigator.clipboard?.writeText(text).then(()=>alert('鉴定结果已复制，发给朋友一起笑一下吧！')).catch(()=>alert(text))}
